services:
  rosecrypto-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rosecrypto-bot:latest
    container_name: rosecrypto-bot
    restart: unless-stopped
    ports:
      - "6080:6080"   # noVNC web UI
      - "5901:5901"   # raw VNC (optional)
    environment:
      - RESOLUTION=1280x800
      - VNC_PASSWORD=rosecry
      - START_BOT=1
      - TZ=Europe/London
      - CHROME_PATH=/usr/bin/chromium-browser
      - CHROME_CHANNEL=chromium
      # xvfb = bot under xvfb-run (virtual display, no windows, no VNC).
      # vnc  = Xfce desktop + noVNC web UI for watching (heavier, but CF
      #        Turnstile passes more reliably with a real WM/compositor).
      - DISPLAY_MODE=xvfb
      # - HEADLESS=1   # uncomment: native headless Chrome (not even xvfb)
    volumes:
      # Persist per-account Chrome profiles (login sessions) across rebuilds
      - rosecrypto-profiles:/home/bot/.rosecrypto-profiles
      # Legacy shared profile (kept, no longer used)
      - rosecrypto-profile:/home/bot/.rosecrypto-chrome-profile
      # Persist accounts + live log + ollama config on host (config edits
      # apply on container restart; vision.mjs reads it at startup)
      - ../accounts.json:/app/accounts.json
      - ../config.json:/app/config.json
      - rosecrypto-log:/app/log
      # Bot writes log to stdout too; bind host log file if desired
      - ../bot.log:/app/bot.log
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined

volumes:
  rosecrypto-profile:
  rosecrypto-profiles:
  rosecrypto-log:
