name: Run Faucet Bot (VM + noVNC)

on:
  workflow_dispatch:
    inputs:
      bot:
        description: Which bot to run
        required: true
        type: choice
        options:
          - onlyfaucet
          - rosecrypto
          - 1xfaucet
        default: onlyfaucet
      email:
        description: Login email / FaucetPay email / 1xfaucet email
        required: true
        type: string
      password:
        description: Password (required for rosecrypto and 1xfaucet; leave blank for onlyfaucet)
        required: false
        type: string
        default: ""
      username:
        description: Username (rosecrypto only; leave blank to use email)
        required: false
        type: string
        default: ""
      vnc_password:
        description: Optional noVNC/VNC password (blank = no password)
        required: false
        type: string
        default: ""
      run_minutes:
        description: How long to keep the VM alive (minutes)
        required: false
        type: string
        default: "180"

concurrency:
  group: run-bot-${{ github.event.inputs.bot }}
  cancel-in-progress: false

jobs:
  run-bot:
    name: ${{ github.event.inputs.bot }} on VM
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BOT: ${{ github.event.inputs.bot }}
      LOGIN_EMAIL: ${{ github.event.inputs.email }}
      LOGIN_PASSWORD: ${{ github.event.inputs.password }}
      LOGIN_USERNAME: ${{ github.event.inputs.username }}
      VNC_PASSWORD: ${{ github.event.inputs.vnc_password }}
      RUN_MINUTES: ${{ github.event.inputs.run_minutes }}
      DISPLAY: ":99"
      RESOLUTION: "1920x1080"
      NOVNC_PORT: "6080"
      VNC_PORT: "5900"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages (Chrome deps, X, noVNC, tools)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb x11vnc xterm novnc websockify dbus-x11 \
            wget curl ca-certificates gnupg \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libpangocairo-1.0-0 \
            fonts-liberation python3-pip jq procps xauth

      - name: Install Google Chrome
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb || sudo dpkg -i /tmp/chrome.deb || true
            sudo apt-get install -f -y
          fi
          google-chrome --version || google-chrome-stable --version

      - name: Install Chromium (Playwright + system fallback)
        run: |
          set -euo pipefail
          # Playwright's Chromium (bots default to channel: chrome, this is backup)
          npx playwright install --with-deps chromium || npx playwright install chromium || true
          # Ubuntu chromium may be snap; try deb package only if available
          if ! command -v chromium-browser >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            echo "System chromium not present — Playwright chromium will be used if CHROME_PATH set"
          fi
          chromium --version 2>/dev/null || chromium-browser --version 2>/dev/null || true

      - name: Install Python deps (onlyfaucet vision helpers)
        run: |
          python3 -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless

      - name: npm install
        run: npm ci || npm install

      - name: Install cloudflared
        run: |
          set -euo pipefail
          CF_VERSION=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          CF_VERSION="${CF_VERSION#version-}"
          wget -q -O /tmp/cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/download/version-${CF_VERSION}/cloudflared-linux-amd64.deb" \
            || wget -q -O /tmp/cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb"
          sudo dpkg -i /tmp/cloudflared.deb || sudo apt-get install -f -y
          cloudflared --version

      - name: Layout HOME paths expected by bots
        run: |
          set -euo pipefail
          # bots resolve some paths as $HOME/adbch/...
          if [ ! -e "$HOME/adbch" ]; then
            ln -s "$GITHUB_WORKSPACE" "$HOME/adbch"
          fi
          mkdir -p "$HOME/adbch"

      - name: Write credentials for selected bot
        env:
          BOT: ${{ github.event.inputs.bot }}
          EMAIL: ${{ github.event.inputs.email }}
          PASSWORD: ${{ github.event.inputs.password }}
          USERNAME: ${{ github.event.inputs.username }}
          LOGIN_EMAIL: ${{ github.event.inputs.email }}
          LOGIN_PASSWORD: ${{ github.event.inputs.password }}
          LOGIN_USERNAME: ${{ github.event.inputs.username }}
        run: |
          set -euo pipefail
          EMAIL="${EMAIL:-${LOGIN_EMAIL:-}}"
          PASSWORD="${PASSWORD:-${LOGIN_PASSWORD:-}}"
          USERNAME="${USERNAME:-${LOGIN_USERNAME:-}}"
          # Make run credentials visible to the bot process later via GITHUB_ENV
          {
            echo "LOGIN_EMAIL=${EMAIL}"
            echo "LOGIN_PASSWORD=${PASSWORD}"
            echo "LOGIN_USERNAME=${USERNAME}"
          } >> "$GITHUB_ENV"

          # Committed account stores from the repo must not win over dispatch inputs.
          # Always REPLACE the selected bot's store with only this run's credentials.
          case "$BOT" in
            onlyfaucet)
              if [ -z "$EMAIL" ]; then echo "onlyfaucet requires email"; exit 1; fi
              export LOGIN_EMAIL="$EMAIL"
              node -e '
                const fs = require("fs");
                const p = "onlyfaucet/accounts.json";
                const email = process.env.LOGIN_EMAIL;
                if (!email) { console.error("missing email"); process.exit(1); }
                fs.writeFileSync(p, JSON.stringify([{ email, claims: 0, lastClaim: null }], null, 2));
                console.log("onlyfaucet accounts.json -> only", email);
              '
              node onlyfaucet/bot.mjs list
              ;;
            rosecrypto)
              ROSE_USER="${USERNAME:-$EMAIL}"
              if [ -z "$ROSE_USER" ]; then
                echo "rosecrypto requires a username (or email as fallback)"; exit 1
              fi
              if [ -z "$PASSWORD" ]; then
                echo "rosecrypto requires a password (pass the password input)"; exit 1
              fi
              export ROSE_USER PASSWORD LOGIN_USERNAME="$ROSE_USER"
              node -e '
                const fs = require("fs");
                const p = "rosecrypto/accounts.json";
                const u = process.env.ROSE_USER;
                const pw = process.env.PASSWORD || "";
                if (!u || !pw) { console.error("rosecrypto requires email/username + password"); process.exit(1); }
                fs.writeFileSync(p, JSON.stringify([{ username: u, password: pw, claims: 0, lastClaim: null }], null, 2));
                console.log("rosecrypto accounts.json -> only", u);
              '
              node rosecrypto/bot.mjs list || true
              ;;
            1xfaucet)
              if [ -z "$EMAIL" ]; then echo "1xfaucet requires email"; exit 1; fi
              if [ -z "$PASSWORD" ]; then echo "1xfaucet requires password"; exit 1; fi
              mkdir -p "$HOME/adbch/1xfaucet"
              export EMAIL PASSWORD LOGIN_EMAIL="$EMAIL" LOGIN_PASSWORD="$PASSWORD"
              # Rebuild the sqlite store so only this run's account remains active.
              node -e '
                const { createRequire } = require("module");
                const require2 = createRequire(process.cwd() + "/package.json");
                let Database;
                try { Database = require("better-sqlite3"); }
                catch { Database = require2("better-sqlite3"); }
                const { join } = require("path");
                const dbPath = join(process.env.HOME, "adbch", "1xfaucet", "accounts.db");
                const db = new Database(dbPath);
                db.pragma("journal_mode = WAL");
                db.exec(`
                  CREATE TABLE IF NOT EXISTS accounts (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    email TEXT UNIQUE NOT NULL,
                    password TEXT NOT NULL,
                    status TEXT DEFAULT '\''active'\'',
                    last_claim_at TEXT,
                    next_available_at TEXT,
                    total_claims INTEGER DEFAULT 0,
                    created_at TEXT DEFAULT (datetime('\''now'\'')),
                    updated_at TEXT DEFAULT (datetime('\''now'\''))
                  );
                `);
                const email = process.env.EMAIL;
                const password = process.env.PASSWORD;
                db.prepare("DELETE FROM accounts WHERE email <> ?").run(email);
                db.prepare(`
                  INSERT INTO accounts (email, password, status, next_available_at, updated_at)
                  VALUES (?, ?, '\''active'\'', NULL, datetime('\''now'\''))
                  ON CONFLICT(email) DO UPDATE SET
                    password=excluded.password,
                    status='\''active'\'',
                    next_available_at=NULL,
                    updated_at=datetime('\''now'\'')
                `).run(email, password);
                const rows = db.prepare("SELECT email, status FROM accounts ORDER BY id").all();
                console.log("1xfaucet accounts.db ->", JSON.stringify(rows));
                db.close();
              '
              export EMAIL PASSWORD
              node -e '
                const fs = require("fs");
                const p = "1xfaucet/config.json";
                const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
                cfg.email = process.env.EMAIL;
                cfg.password = process.env.PASSWORD;
                fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
                console.log("1xfaucet config.json email/password updated");
              '
              ;;
            *)
              echo "Unknown bot: $BOT"; exit 1;;
          esac

          echo "Active credentials for this run:"
          echo "  bot=$BOT email=${EMAIL:-} username=${USERNAME:-} password_set=$([ -n "$PASSWORD" ] && echo yes || echo no)"

      - name: Start Xvfb + x11vnc + noVNC
        run: |
          set -euo pipefail
          export DISPLAY=:99

          fail() {
            echo "FAILED: $1"
            echo "===== xvfb.log ====="; cat /tmp/xvfb.log 2>/dev/null || true
            echo "===== x11vnc.log ====="; cat /tmp/x11vnc.log 2>/dev/null || true
            echo "===== websockify.log ====="; cat /tmp/websockify.log 2>/dev/null || true
            exit 1
          }

          for cmd in Xvfb x11vnc websockify curl; do
            command -v "$cmd" >/dev/null || fail "missing command: $cmd"
          done

          rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 2>/dev/null || true
          mkdir -p /tmp/.X11-unix && sudo chmod 1777 /tmp/.X11-unix || true

          # setsid: survive GitHub Actions step teardown (plain & gets killed at step end)
          # -ac disables access control (CI-only VM; VNC stays on localhost + CF tunnel)
          # no +extension RANDR (can abort some Xvfb builds); no x11vnc -listen (reverse mode)
          setsid nohup Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 < /dev/null &
          echo $! > /tmp/xvfb.pid

          XVFB_OK=0
          for _ in $(seq 1 20); do
            if [ -S /tmp/.X11-unix/X99 ]; then XVFB_OK=1; break; fi
            if ! kill -0 "$(cat /tmp/xvfb.pid)" 2>/dev/null; then break; fi
            sleep 0.5
          done
          [ "$XVFB_OK" = 1 ] || fail "Xvfb did not create /tmp/.X11-unix/X99"

          if [ -n "${VNC_PASSWORD:-}" ]; then
            if x11vnc -storepasswd "$VNC_PASSWORD" /tmp/.vncpass >/tmp/vncpass.log 2>&1; then
              setsid nohup x11vnc -display :99 -rfbport 5900 -localhost \
                -rfbauth /tmp/.vncpass -shared -forever \
                >/tmp/x11vnc.log 2>&1 < /dev/null &
            else
              echo "x11vnc -storepasswd failed; continuing with -nopw"
              setsid nohup x11vnc -display :99 -rfbport 5900 -localhost \
                -nopw -shared -forever \
                >/tmp/x11vnc.log 2>&1 < /dev/null &
            fi
          else
            setsid nohup x11vnc -display :99 -rfbport 5900 -localhost \
              -nopw -shared -forever \
              >/tmp/x11vnc.log 2>&1 < /dev/null &
          fi
          echo $! > /tmp/x11vnc.pid

          # x11vnc 0.9.16 can take several seconds to bind; do not pass -nopn (removed/unsupported)
          X11_OK=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/x11vnc.pid)" 2>/dev/null; then break; fi
            if (exec 3<>/dev/tcp/127.0.0.1/5900) 2>/dev/null; then
              exec 3>&- 2>/dev/null || true
              X11_OK=1
              break
            fi
            sleep 0.5
          done
          [ "$X11_OK" = 1 ] || fail "x11vnc did not listen on 127.0.0.1:5900"

          NOVNC_WEB=""
          for d in /usr/share/novnc /usr/share/webapps/novnc /usr/share/novnc/web /usr/share/novnc/share; do
            if [ -f "$d/vnc.html" ] || [ -f "$d/vnc_lite.html" ] || [ -f "$d/index.html" ]; then
              NOVNC_WEB="$d"
              break
            fi
          done
          if [ -z "$NOVNC_WEB" ]; then
            echo "noVNC package paths:"
            dpkg -L novnc 2>/dev/null || true
            ls -la /usr/share/novnc 2>/dev/null || true
            fail "noVNC web not found"
          fi
          echo "noVNC web: $NOVNC_WEB"

          setsid nohup websockify --web "$NOVNC_WEB" 6080 127.0.0.1:5900 >/tmp/websockify.log 2>&1 < /dev/null &
          echo $! > /tmp/websockify.pid

          NOVNC_OK=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/websockify.pid)" 2>/dev/null; then break; fi
            if curl -sf -o /dev/null http://127.0.0.1:6080/vnc.html \
              || curl -sf -o /dev/null http://127.0.0.1:6080/vnc_lite.html \
              || curl -sf -o /dev/null http://127.0.0.1:6080/; then
              NOVNC_OK=1
              break
            fi
            sleep 0.5
          done
          [ "$NOVNC_OK" = 1 ] || fail "noVNC/websockify not responding on :6080"
          echo "noVNC local OK (web=$NOVNC_WEB)"

      - name: Start Cloudflare quick tunnel
        run: |
          set -euo pipefail
          # quick tunnel → random *.trycloudflare.com URL
          # setsid: survive GitHub Actions step teardown
          setsid nohup cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate >/tmp/cloudflared.log 2>&1 < /dev/null &
          echo $! > /tmp/cloudflared.pid

          NOVNC_URL=""
          for i in $(seq 1 40); do
            NOVNC_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$NOVNC_URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$NOVNC_URL" ]; then
            echo "Failed to get tunnel URL"; cat /tmp/cloudflared.log; exit 1
          fi
          echo "NOVNC_URL=$NOVNC_URL" >> "$GITHUB_ENV"
          {
            echo "## noVNC desktop"
            echo ""
            echo "**Open this URL in your browser to view/control the VM desktop:**"
            echo ""
            echo "\`\`\`"
            echo "$NOVNC_URL/vnc.html?autoconnect=true&resize=scale&scale=local&viewOnly=false"
            echo "\`\`\`"
            echo ""
            echo "- Bot: \`$BOT\`"
            if [ -n "${VNC_PASSWORD:-}" ]; then
              echo "- VNC password: (set)"
            else
              echo "- VNC password: none"
            fi
            echo "- Local noVNC: http://127.0.0.1:6080/vnc.html"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "noVNC via Cloudflare: $NOVNC_URL/vnc.html?autoconnect=true&resize=scale&scale=local&viewOnly=false"

      - name: Prepare Chrome env for bots
        run: |
          set -euo pipefail
          # Prefer system Google Chrome (bots use channel: chrome)
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
            echo "CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            # fallback: playwright chromium
            CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome-linux/*' 2>/dev/null | head -1 || true)
            if [ -n "$CHROME_BIN" ]; then
              echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
              echo "CHROME_CHANNEL=chromium" >> "$GITHUB_ENV"
            fi
          fi
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Clear any stale bot locks from the runner image
          rm -f /tmp/onlyfaucet.lock /tmp/rosecrypto.lock /tmp/1xfaucet_bot.lock 2>/dev/null || true
          # Safety: drop any leftover committed accounts that aren't this run's login
          if [ -n "${LOGIN_EMAIL:-}" ]; then
            case "$BOT" in
              onlyfaucet)
                node -e '
                  const fs = require("fs");
                  const p = "onlyfaucet/accounts.json";
                  const email = process.env.LOGIN_EMAIL;
                  if (fs.existsSync(p)) {
                    const arr = JSON.parse(fs.readFileSync(p, "utf8"));
                    const keep = arr.filter(a => a.email === email);
                    if (JSON.stringify(keep) !== JSON.stringify(arr)) {
                      fs.writeFileSync(p, JSON.stringify(keep, null, 2));
                      console.log("onlyfaucet: dropped non-run accounts");
                    }
                  }
                '
                ;;
              1xfaucet)
                node -e '
                  let Database;
                  try { Database = require("better-sqlite3"); }
                  catch { Database = require(require("path").join(process.env.HOME, "adbch", "node_modules", "better-sqlite3")); }
                  const { join } = require("path");
                  const db = new Database(join(process.env.HOME, "adbch", "1xfaucet", "accounts.db"));
                  db.prepare("DELETE FROM accounts WHERE email <> ?").run(process.env.LOGIN_EMAIL);
                  db.close();
                ' || true
                ;;
            esac
          fi
          if [ -n "${LOGIN_USERNAME:-}" ] || [ -n "${LOGIN_EMAIL:-}" ]; then
            if [ "$BOT" = "rosecrypto" ]; then
              export LOGIN_USERNAME="${LOGIN_USERNAME:-$LOGIN_EMAIL}"
              node -e '
                const fs = require("fs");
                const p = "rosecrypto/accounts.json";
                const u = process.env.LOGIN_USERNAME;
                if (fs.existsSync(p) && u) {
                  const arr = JSON.parse(fs.readFileSync(p, "utf8"));
                  const keep = arr.filter(a => a.username === u);
                  if (JSON.stringify(keep) !== JSON.stringify(arr)) {
                    fs.writeFileSync(p, JSON.stringify(keep, null, 2));
                    console.log("rosecrypto: dropped non-run accounts");
                  }
                }
              '
            fi
          fi

      - name: Start selected bot
        run: |
          set -euo pipefail
          export DISPLAY=:99
          # Ensure run credentials are in the bot process environment
          export LOGIN_EMAIL="${LOGIN_EMAIL:-}"
          export LOGIN_PASSWORD="${LOGIN_PASSWORD:-}"
          export LOGIN_USERNAME="${LOGIN_USERNAME:-${USERNAME:-}}"
          echo "Starting $BOT with LOGIN_EMAIL=${LOGIN_EMAIL:-} LOGIN_USERNAME=${LOGIN_USERNAME:-}"
          mkdir -p /tmp/bot-logs
          case "$BOT" in
            onlyfaucet)
              setsid nohup node onlyfaucet/bot.mjs > /tmp/bot-logs/onlyfaucet.log 2>&1 < /dev/null &
              echo $! > /tmp/bot.pid
              ;;
            rosecrypto)
              setsid nohup node --unhandled-rejections=warn rosecrypto/bot.mjs > /tmp/bot-logs/rosecrypto.log 2>&1 < /dev/null &
              echo $! > /tmp/bot.pid
              ;;
            1xfaucet)
              # waits for manual login via noVNC (Turnstile), then claims for LOGIN_EMAIL
              setsid nohup node 1xfaucet/bot.mjs > /tmp/bot-logs/1xfaucet.log 2>&1 < /dev/null &
              echo $! > /tmp/bot.pid
              ;;
          esac
          sleep 5
          echo "Bot PID: $(cat /tmp/bot.pid)"
          echo "=== early bot log ==="
          tail -n 40 /tmp/bot-logs/*.log || true
          if ! kill -0 "$(cat /tmp/bot.pid)" 2>/dev/null; then
            echo "Bot exited early"; cat /tmp/bot-logs/*.log; exit 1
          fi

      - name: Keep VM alive and stream logs
        run: |
          set -euo pipefail
          echo "Running for ${RUN_MINUTES} minutes. noVNC: ${NOVNC_URL}/vnc.html?autoconnect=true&resize=scale&scale=local&viewOnly=false"
          END=$(( $(date +%s) + RUN_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! kill -0 "$(cat /tmp/bot.pid 2>/dev/null || echo 0)" 2>/dev/null; then
              echo "Bot process died — dumping logs and exiting"
              tail -n 200 /tmp/bot-logs/*.log || true
              exit 1
            fi
            echo "---- $(date -u +%H:%M:%S) bot tail ----"
            tail -n 8 /tmp/bot-logs/*.log 2>/dev/null || true
            # warn near end
            REMAIN=$(( END - $(date +%s) ))
            if [ "$REMAIN" -lt 300 ] && [ "$REMAIN" -gt 295 ]; then
              echo "Less than 5 minutes remaining"
            fi
            sleep 30
          done
          echo "Run window finished"

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          cp -a /tmp/bot-logs/. artifacts/ 2>/dev/null || true
          cp -a /tmp/cloudflared.log artifacts/ 2>/dev/null || true
          cp -a /tmp/x11vnc.log artifacts/ 2>/dev/null || true
          cp -a /tmp/websockify.log artifacts/ 2>/dev/null || true
          cp -a /tmp/xvfb.log artifacts/ 2>/dev/null || true
          cp -a /tmp/onlyfaucet-shots/. artifacts/shots/ 2>/dev/null || true
          ls -la artifacts || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.event.inputs.bot }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 7
